name: build
# Reusable: build and test the engines on GitHub's Linux ARM64 runner, optionally package them.
# Called by checks.yml (push / pull request) and release.yml (tags). No secrets, no model weights:
# every test here is model-free.
#
# Toolchain: Fedora 44 container (GCC 16, the compiler the vendored ggml kernels were
# bit-matched with) + Rust from rustup at a pinned version. The runner is an Arm Neoverse N2
# class core (Azure Cobalt 100); the binaries keep the production flags (Rust target-cpu=oryon-1
# from .cargo/config.toml, ggml -march=armv8.6-a+dotprod+i8mm+fp16+bf16+nosve+nosme), and the
# tests run those same binaries' code on the runner.
on:
  workflow_call:
    inputs:
      version:
        description: Version string in the tarball names (the tag, or dev-<sha>)
        type: string
        required: true
      package:
        description: Package tarballs and upload them as the "dist-*" artifacts
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

defaults:
  run:
    shell: bash   # bash -eo pipefail

jobs:
  engine:
    name: oxe-server (MoE) + oxi
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      # Docker's default seccomp profile blocks io_uring; the Flash IO tests use it.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: tools/ci/setup_toolchain.sh "$RUST_VERSION"
      - name: Build oxe-server and oxi
        run: cargo build --release --locked -p server -p image-flow --bin oxe-server --bin oxi
      - name: Smoke
        run: |
          ./target/release/oxe-server --help > help.txt && head -n 3 help.txt
          ./target/release/oxi > oxi.txt 2>&1 || true
          head -n 3 oxi.txt
      - name: Model-free tests (workspace without the Flash crate)
        timeout-minutes: 40
        # the numerics golden is recorded for the qualified reference platforms, not
        # for this hosted runner's kernel path: print its hash instead of failing (P2b, M3)
        env:
          OXE_NUMERICS_GOLDEN_UNLISTED: print
        run: cargo test --release --locked --no-fail-fast --workspace --exclude qwen4exp
      - name: Package
        if: inputs.package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tools/ci/package.sh oxe-server "$VERSION" dist server - target oxe-server
          tools/ci/package.sh oxi "$VERSION" dist image-flow - target oxi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: dist-engine
          path: dist/
          if-no-files-found: error
          retention-days: 7

  flash:
    name: oxe-server --features flash
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      # Docker's default seccomp profile blocks io_uring; the Flash IO tests use it.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 150
    env:
      OXF_GGML_PROD: ${{ github.workspace }}/ggml-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: tools/ci/setup_toolchain.sh "$RUST_VERSION"
      - name: Model-free Flash package licence fixtures (also without packaging)
        run: python3 -I tools/ci/test_flash_package.py
      - name: Production ggml from the pinned public sources
        run: tools/ci/build_ggml_prod.sh "$RUNNER_TEMP/flash-src"
      - name: Keep the ggml libraries for identity checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ggml-prod
          path: ggml-prod/
          if-no-files-found: error
          retention-days: 14
      - name: Build oxe-server --features flash, flash-m0, flash-m3
        run: >-
          cargo build --release --locked -p server -p qwen4exp --features server/flash
          --bin oxe-server --bin flash-m0 --bin flash-m3
      - name: Smoke
        run: ./target/release/oxe-server --help > help.txt && head -n 3 help.txt
      - name: Model-free tests (Flash)
        timeout-minutes: 40
        run: |
          cargo test --release --locked --no-fail-fast -p server --lib --features flash
          cargo test --release --locked --no-fail-fast -p qwen4exp
          ./target/release/flash-m3 selftest | tee selftest.txt
          ! grep -q FAIL selftest.txt
      - name: Package
        if: inputs.package
        env:
          VERSION: ${{ inputs.version }}
        run: tools/ci/package.sh oxe-server-flash "$VERSION" dist server flash target oxe-server flash-m0 flash-m3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: dist-flash
          path: dist/
          if-no-files-found: error
          retention-days: 7
